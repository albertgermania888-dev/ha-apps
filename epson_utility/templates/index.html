<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Epson Service</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #fafafa; color: #333; margin: 0; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 450px; margin: 0 auto; text-align: center; }
        .section { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
        .section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        button { display: block; width: 100%; padding: 12px; margin: 10px 0; background: #03a9f4; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #0288d1; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .clean { background: #ff9800; }
        .clean:hover { background: #f57c00; }
        
        .file-upload { display: flex; flex-direction: column; gap: 10px; margin-top: 10px;}
        .file-upload input[type="file"] { border: 1px dashed #03a9f4; padding: 15px; width: 100%; border-radius: 4px; box-sizing: border-box; background: #fcfcfc; cursor: pointer; }
        
        .print-settings { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 10px; text-align: left; }
        .print-settings label { font-size: 12px; color: #666; font-weight: bold; }
        .print-settings select, .print-settings input { width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        
        #preview_container { display: none; margin-top: 15px; padding: 10px; border: 1px solid #e0e0e0; border-radius: 4px; background: #fafafa; }
        
        .status-box { background: #f1f8e9; padding: 15px; border-radius: 4px; border: 1px solid #c5e1a5; margin-bottom: 20px; text-align: left; }
        .status-item { margin: 5px 0; font-size: 14px; }
        .status-val { font-weight: bold; color: #2e7d32; }
        #action-status { margin-top: 15px; font-weight: bold; min-height: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="margin-bottom: 5px;" id="st_model">Загрузка принтера...</h2>
        <p style="margin-top:0px; font-size:13px; color:#888;">IP: <span id="st_ip">Поиск...</span></p>
        
        <div class="status-box">
            <div class="status-item">Состояние: <span class="status-val" id="st_printer">Синхронизация...</span></div>
        </div>

        <div class="section">
            <h3 style="margin-bottom: 5px; text-align: left;">Обслуживание</h3>
            <button id="btn_nozzle" onclick="sendCommand('nozzle_check')">Печать проверки дюз</button>
            <button id="btn_clean" class="clean" onclick="sendCommand('clean_head')">Прочистка печатающей головки</button>
        </div>

        <div class="section">
            <h3 style="margin-bottom: 10px; text-align: left;">Печать документа</h3>
            <div class="file-upload">
                <input type="file" id="file_input" accept=".pdf,.jpg,.jpeg,.png,.txt">
                
                <div id="preview_container">
                    <div id="preview_content"></div>
                </div>

                <div class="print-settings">
                    <div>
                        <label>Копии</label>
                        <input type="number" id="p_copies" value="1" min="1" max="50">
                    </div>
                    <div>
                        <label>Цвет</label>
                        <select id="p_color">
                            <option value="color">Цветная</option>
                            <option value="monochrome">Ч/Б</option>
                        </select>
                    </div>
                    <div>
                        <label>Формат</label>
                        <select id="p_media">
                            <option value="A4">A4</option>
                            <option value="4x6">Фото 10x15</option>
                        </select>
                    </div>
                </div>

                <button id="btn_upload" onclick="uploadFile()" style="background: #4caf50;">Отправить на печать</button>
            </div>
        </div>
        
        <div id="action-status"></div>
    </div>

    <script>
        // Обновление статусов
        function fetchStatus() {
            fetch('api/state')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('st_model').innerText = data.model;
                    document.getElementById('st_ip').innerText = data.ip;
                    document.getElementById('st_printer').innerText = data.status;
                })
                .catch(err => console.error(err));
        }
        setInterval(fetchStatus, 3000);
        fetchStatus();

        // Предпросмотр выбранного файла
        document.getElementById('file_input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const previewContainer = document.getElementById('preview_container');
            const previewContent = document.getElementById('preview_content');
            
            previewContent.innerHTML = '';
            if (!file) {
                previewContainer.style.display = 'none';
                return;
            }
            
            previewContainer.style.display = 'block';
            const fileURL = URL.createObjectURL(file);
            
            if (file.type.startsWith('image/')) {
                previewContent.innerHTML = `<img src="${fileURL}" style="max-width:100%; max-height:250px; border-radius:4px; border:1px solid #ccc;">`;
            } else if (file.type === 'application/pdf') {
                previewContent.innerHTML = `<iframe src="${fileURL}" width="100%" height="300px" style="border:1px solid #ccc; border-radius:4px;"></iframe>`;
            } else {
                previewContent.innerHTML = `<p style="color:#666; font-size:13px; margin:0;">Файл готов к отправке (предпросмотр недоступен)</p>`;
            }
        });

        function setUIState(disabled, text, color) {
            const statusDiv = document.getElementById('action-status');
            document.getElementById('btn_nozzle').disabled = disabled;
            document.getElementById('btn_clean').disabled = disabled;
            document.getElementById('btn_upload').disabled = disabled;
            statusDiv.innerText = text;
            statusDiv.style.color = color;
        }

        function sendCommand(action) {
            setUIState(true, "Отправка сервисной команды...", "#333");
            fetch('api/' + action, { method: 'POST' })
                .then(res => res.json())
                .then(data => setUIState(false, data.msg, data.status === "SUCCESS" ? "green" : "red"))
                .catch(err => setUIState(false, "Ошибка: " + err.message, "red"));
        }

        function uploadFile() {
            const fileInput = document.getElementById('file_input');
            if (!fileInput.files.length) {
                setUIState(false, "Пожалуйста, выберите файл", "red");
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            formData.append('copies', document.getElementById('p_copies').value);
            formData.append('color', document.getElementById('p_color').value);
            formData.append('media', document.getElementById('p_media').value);

            setUIState(true, "Передача файла на принтер...", "#333");

            fetch('api/upload_print', { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                setUIState(false, data.msg, data.status === "SUCCESS" ? "green" : "red");
                fileInput.value = '';
                document.getElementById('preview_container').style.display = 'none';
            })
            .catch(err => setUIState(false, "Ошибка сети: " + err.message, "red"));
        }
    </script>
</body>
</html>
