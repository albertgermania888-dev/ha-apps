<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Epson Service</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 15px; background: #fafafa; color: #333; margin: 0; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 480px; margin: 0 auto; text-align: center; }
        .section { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
        .section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        h3 { margin-top: 0; margin-bottom: 15px; text-align: left; font-size: 16px; }
        
        button { display: block; width: 100%; padding: 12px; margin: 10px 0; background: #03a9f4; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 15px; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #0288d1; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .clean { background: #ff9800; }
        .clean:hover { background: #f57c00; }
        
        .status-box { background: #f1f8e9; padding: 12px; border-radius: 4px; border: 1px solid #c5e1a5; margin-bottom: 20px; text-align: left; font-size: 14px; }
        .status-val { font-weight: bold; color: #2e7d32; }
        
        .toggle-box { display: flex; align-items: center; justify-content: space-between; background: #fff8e1; padding: 10px 12px; border-radius: 4px; border: 1px solid #ffe082; text-align: left; font-size: 13px; margin-bottom: 10px; }
        .toggle-box label { cursor: pointer; }
        
        .file-upload input[type="file"] { border: 1px dashed #03a9f4; padding: 15px; width: 100%; border-radius: 4px; box-sizing: border-box; background: #fcfcfc; cursor: pointer; margin-bottom: 15px; }
        
        .preview-box { display: none; margin-bottom: 15px; padding: 10px; border: 1px solid #e0e0e0; border-radius: 4px; background: #fafafa; }
        .preview-box img { max-width: 100%; max-height: 250px; border: 1px solid #ccc; border-radius: 4px; }
        
        .print-settings { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: left; margin-bottom: 15px; }
        .setting-group { display: flex; flex-direction: column; }
        .setting-group label { font-size: 12px; color: #666; font-weight: bold; margin-bottom: 4px; }
        .setting-group select, .setting-group input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
        
        #action-status { margin-top: 15px; font-weight: bold; font-size: 14px; min-height: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="margin: 0 0 5px 0;" id="st_model">Загрузка...</h2>
        <p style="margin: 0 0 15px 0; font-size: 13px; color: #888;">IP: <span id="st_ip">Поиск...</span></p>
        
        <div class="status-box">
            Состояние: <span class="status-val" id="st_printer">Синхронизация...</span>
        </div>

        <div class="section">
            <h3>Обслуживание</h3>
            <button id="btn_nozzle" onclick="sendCommand('nozzle_check')">Печать проверки дюз</button>
            <button id="btn_clean" class="clean" onclick="sendCommand('clean_head')">Прочистка печатающей головки</button>
            
            <div class="toggle-box">
                <label for="auto_check">Авто-проверка дюз (раз в 7 дней):</label>
                <input type="checkbox" id="auto_check" onchange="toggleAutoPrint()">
            </div>
        </div>

        <div class="section">
            <h3>Печать документа</h3>
            <div class="file-upload">
                <input type="file" id="file_input" accept=".pdf,.jpg,.jpeg,.png,.txt">
                
                <div class="preview-box" id="preview_container">
                    <img id="preview_img" src="">
                </div>

                <div class="print-settings">
                    <div class="setting-group">
                        <label>Цветность</label>
                        <select id="p_color">
                            <option value="color">Цветная</option>
                            <option value="monochrome">Черно-белая</option>
                        </select>
                    </div>
                    <div class="setting-group">
                        <label>Качество</label>
                        <select id="p_quality">
                            <option value="4">Стандартное</option>
                            <option value="5">Высокое</option>
                            <option value="3">Черновик</option>
                        </select>
                    </div>
                    <div class="setting-group">
                        <label>Ориентация</label>
                        <select id="p_orientation">
                            <option value="3">Книжная (Вертикально)</option>
                            <option value="4">Альбомная (Горизонтально)</option>
                        </select>
                    </div>
                    <div class="setting-group">
                        <label>Формат бумаги</label>
                        <select id="p_media">
                            <option value="A4">A4</option>
                            <option value="4x6">Фото 10x15</option>
                        </select>
                    </div>
                    <div class="setting-group">
                        <label>Копии</label>
                        <input type="number" id="p_copies" value="1" min="1" max="50">
                    </div>
                    <div class="setting-group">
                        <label>Страницы (напр. 1-3)</label>
                        <input type="text" id="p_pages" placeholder="Все">
                    </div>
                </div>

                <button id="btn_upload" onclick="printFile()" style="background: #4caf50;">Распечатать</button>
            </div>
        </div>
        
        <div id="action-status"></div>
    </div>

    <script>
        function fetchStatus() {
            fetch('api/state')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('st_model').innerText = data.model;
                    document.getElementById('st_ip').innerText = data.ip;
                    document.getElementById('st_printer').innerText = data.status;
                    if (document.activeElement !== document.getElementById('auto_check')) {
                        document.getElementById('auto_check').checked = data.auto_check;
                    }
                }).catch(err => console.error(err));
        }
        setInterval(fetchStatus, 3000);
        fetchStatus();

        function toggleAutoPrint() {
            const isChecked = document.getElementById('auto_check').checked;
            fetch('api/config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ auto_check: isChecked })
            });
        }

        document.getElementById('file_input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const previewContainer = document.getElementById('preview_container');
            const previewImg = document.getElementById('preview_img');
            
            if (!file) {
                previewContainer.style.display = 'none';
                return;
            }
            
            setUIState(true, "Генерация предпросмотра...", "#333");
            const formData = new FormData();
            formData.append('file', file);
            
            fetch('api/upload', { method: 'POST', body: formData })
                .then(res => res.json())
                .then(data => {
                    if(data.preview) {
                        previewImg.src = data.preview;
                        previewContainer.style.display = 'block';
                        setUIState(false, "Файл загружен. Готов к печати.", "green");
                    } else {
                        previewContainer.style.display = 'none';
                        setUIState(false, "Файл загружен (предпросмотр недоступен)", "green");
                    }
                }).catch(err => setUIState(false, "Ошибка: " + err.message, "red"));
        });

        function setUIState(disabled, text, color) {
            const statusDiv = document.getElementById('action-status');
            document.getElementById('btn_nozzle').disabled = disabled;
            document.getElementById('btn_clean').disabled = disabled;
            document.getElementById('btn_upload').disabled = disabled;
            document.getElementById('file_input').disabled = disabled;
            statusDiv.innerText = text;
            statusDiv.style.color = color;
        }

        function sendCommand(action) {
            setUIState(true, "Отправка сервисной команды...", "#333");
            fetch('api/' + action, { method: 'POST' })
                .then(res => res.json())
                .then(data => setUIState(false, data.msg, data.status === "SUCCESS" ? "green" : "red"))
                .catch(err => setUIState(false, "Ошибка: " + err.message, "red"));
        }

        function printFile() {
            setUIState(true, "Передача данных на принтер...", "#333");
            const payload = {
                copies: document.getElementById('p_copies').value,
                color: document.getElementById('p_color').value,
                media: document.getElementById('p_media').value,
                quality: document.getElementById('p_quality').value,
                orientation: document.getElementById('p_orientation').value,
                pages: document.getElementById('p_pages').value
            };

            fetch('api/print', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                setUIState(false, data.msg, data.status === "SUCCESS" ? "green" : "red");
                if(data.status === "SUCCESS") {
                    document.getElementById('file_input').value = '';
                    document.getElementById('preview_container').style.display = 'none';
                }
            })
            .catch(err => setUIState(false, "Ошибка сети: " + err.message, "red"));
        }
    </script>
</body>
</html>
