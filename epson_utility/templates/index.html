<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Epson Service</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #fafafa; color: #333; margin: 0; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 450px; margin: 0 auto; text-align: center; }
        .section { margin-bottom: 25px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
        .section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        button { display: block; width: 100%; padding: 12px; margin: 10px 0; background: #03a9f4; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #0288d1; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .clean { background: #ff9800; }
        .clean:hover { background: #f57c00; }
        .file-upload { display: flex; flex-direction: column; gap: 10px; align-items: center; margin-top: 10px;}
        .file-upload input[type="file"] { border: 1px solid #ccc; padding: 10px; width: 100%; border-radius: 4px; box-sizing: border-box; background: #fafafa; }
        .status-box { background: #f1f8e9; padding: 15px; border-radius: 4px; border: 1px solid #c5e1a5; margin-bottom: 20px; text-align: left; }
        .status-item { margin: 5px 0; font-size: 14px; }
        .status-val { font-weight: bold; color: #2e7d32; }
        #action-status { margin-top: 15px; font-weight: bold; min-height: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Управление Epson</h2>
        <p style="margin-top:-10px; font-size:14px; color:#666;">IP: <b id="st_ip">Поиск...</b></p>
        
        <div class="status-box">
            <div class="status-item">Состояние: <span class="status-val" id="st_printer">Загрузка...</span></div>
            <div class="status-item">Памперс: <span class="status-val" id="st_waste">Загрузка...</span></div>
        </div>

        <div class="section">
            <h3 style="margin-bottom: 5px;">Сервис</h3>
            <button id="btn_nozzle" onclick="sendCommand('nozzle_check')">Печать проверки дюз</button>
            <button id="btn_clean" class="clean" onclick="sendCommand('clean_head')">Прочистка печатающей головки</button>
        </div>

        <div class="section">
            <h3 style="margin-bottom: 5px;">Печать документа</h3>
            <div class="file-upload">
                <input type="file" id="file_input" accept=".pdf,.jpg,.jpeg,.png,.txt">
                <button id="btn_upload" onclick="uploadFile()" style="background: #4caf50;">Отправить на печать</button>
            </div>
        </div>
        
        <div id="action-status"></div>
    </div>

    <script>
        function fetchStatus() {
            fetch('api/state')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('st_ip').innerText = data.ip;
                    document.getElementById('st_printer').innerText = data.status;
                    document.getElementById('st_waste').innerText = data.waste;
                })
                .catch(err => console.error("Ошибка:", err));
        }
        setInterval(fetchStatus, 3000);
        fetchStatus();

        function setUIState(disabled, text, color) {
            const statusDiv = document.getElementById('action-status');
            document.getElementById('btn_nozzle').disabled = disabled;
            document.getElementById('btn_clean').disabled = disabled;
            document.getElementById('btn_upload').disabled = disabled;
            statusDiv.innerText = text;
            statusDiv.style.color = color;
        }

        function sendCommand(action) {
            setUIState(true, "Отправка команды...", "#333");
            fetch('api/' + action, { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    setUIState(false, data.msg, data.status === "SUCCESS" ? "green" : "red");
                })
                .catch(err => {
                    setUIState(false, "Ошибка: " + err.message, "red");
                });
        }

        function uploadFile() {
            const fileInput = document.getElementById('file_input');
            if (!fileInput.files.length) {
                setUIState(false, "Пожалуйста, выберите файл", "red");
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            setUIState(true, "Загрузка файла и отправка на печать...", "#333");

            fetch('api/upload_print', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                setUIState(false, data.msg, data.status === "SUCCESS" ? "green" : "red");
                fileInput.value = '';
            })
            .catch(err => {
                setUIState(false, "Ошибка отправки: " + err.message, "red");
            });
        }
    </script>
</body>
</html>
